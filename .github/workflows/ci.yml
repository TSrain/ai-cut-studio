name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-pil
      - name: Install locked JavaScript dependencies
        run: npm ci --prefix studio/templates/remotion-base --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run test:studio
      - run: npm run test:workflow
      - run: npm run audit:release
